spring.application.name=transaction-service
server.port=8082

spring.datasource.url=jdbc:h2:mem:transactiondb
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true

spring.cloud.config.enabled=false

services.account.url=http://localhost:8081

# Circuit Breaker
resilience4j.circuitbreaker.instances.accountService.slidingWindowSize=4
resilience4j.circuitbreaker.instances.accountService.minimumNumberOfCalls=2
resilience4j.circuitbreaker.instances.accountService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.accountService.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.accountService.permittedNumberOfCallsInHalfOpenState=2
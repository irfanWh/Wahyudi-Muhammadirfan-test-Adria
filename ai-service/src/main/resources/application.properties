spring.application.name=ai-service
server.port=8083

spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.options.model=gpt-4o-mini

spring.ai.mcp.client.name=banking-ai-agent
spring.ai.mcp.client.type=SYNC
spring.ai.mcp.client.streamable-http.connections.account-service.url=${ACCOUNT_SERVICE_URL:http://localhost:8081}
spring.ai.mcp.client.streamable-http.connections.transaction-service.url=${TRANSACTION_SERVICE_URL:http://localhost:8082}
